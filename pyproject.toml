[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gaincraft"
version = "0.0.1"
description = "A CLI for validated HDR gain-map image derivative workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Suhail" }]
keywords = ["hdr", "gain-map", "ultrahdr", "jpeg", "libvips"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
]
dependencies = [
  "numpy>=2.4.6",
  "rich>=15,<16",
  "tifffile>=2026.3.3",
  "typer>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
  "twine>=6.2,<7",
]

[project.scripts]
gaincraft = "gaincraft.cli:app"

[project.urls]
Changelog = "https://github.com/orbyts/gaincraft/blob/main/CHANGELOG.md"
Homepage = "https://github.com/orbyts/gaincraft"
Issues = "https://github.com/orbyts/gaincraft/issues"
Repository = "https://github.com/orbyts/gaincraft"

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gaincraft"]

[tool.hatch.build.targets.wheel.force-include]
"src/gaincraft/backends/apple/imageio.swift" = "gaincraft/backends/apple/imageio.swift"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[dependency-groups]
dev = [
    "packaging>=26.3",
    "twine>=6.2.0",
]
